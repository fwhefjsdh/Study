<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Answer Grid: spaced-repetition exam practice with marking, a harder-than-the-slides guardrail and exports.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<title>Answer Grid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232446c7'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16M13 6v20M19 6v20' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="row">
      <a class="brand cardlink" href="#/queue"><h1>Answer Grid</h1><small id="todayLbl" class="mono"></small></a>
      <nav aria-label="Screens">
        <a href="#/queue" data-go="queue">Queue</a>
        <a href="#/browse" data-go="browse">Browse</a>
        <a href="#/stats" data-go="stats">Stats</a>
        <a href="#/courses" data-go="courses">Courses</a>
        <a href="#/settings" data-go="settings">Settings</a>
      </nav>
    </div>
  </header>
  <div id="banner" class="stack"></div>
  <main id="main" class="stack">
    <div class="panel"><p class="muted">Loading your question bank…</p></div>
  </main>
</div>
<dialog id="dlg" aria-label="Export"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Answer Grid needs JavaScript.</p></noscript>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="data/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
